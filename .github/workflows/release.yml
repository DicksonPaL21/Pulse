name: Release

# Builds the GitHub edition (Setup.exe + payload zip) in a clean runner, so a
# release never depends on one developer's machine.
#
# - Run it by hand (Actions > Release > Run workflow) to get the packages as
#   a workflow artifact for testing.
# - Push a tag like v1.4.0 to also create a DRAFT GitHub release with the
#   packages attached. Nothing is published until a maintainer reviews the
#   draft and clicks Publish.
#
# Code signing (SignPath Foundation): Pulse.exe and PulseService.exe are
# signed before they are packaged, then Setup.exe is signed. Manual runs use
# the test certificate; tag builds use the release certificate once the
# repository variable SIGNPATH_RELEASE_SIGNING is 'true'. Without the
# SIGNPATH_API_TOKEN secret and SIGNPATH_ORGANIZATION_ID variable the
# packages are built unsigned. See docs/architecture/25-beta-release.md,
# "Signing releases".

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  # SignPath downloads the unsigned workflow artifacts with this token.
  actions: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }

      - name: Check version stamps
        id: version
        shell: pwsh
        run: |
          $script = Get-Content tools/scripts/package_beta.ps1 -Raw
          $iss = Get-Content tools/installer/Pulse.iss -Raw
          $pkg = [regex]::Match($script, '\$Version = "([^"]+)"').Groups[1].Value
          $setup = [regex]::Match($iss, '#define MyAppVersion "([^"]+)"').Groups[1].Value
          if (-not $pkg -or $pkg -ne $setup) {
            throw "package_beta.ps1 ($pkg) and Pulse.iss ($setup) disagree on the version"
          }
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".TrimStart('v')
            if ($tag -ne $pkg) { throw "Tag v$tag does not match version $pkg" }
          }
          "version=$pkg" >> $env:GITHUB_OUTPUT

      - name: Signing plan
        id: signing
        shell: pwsh
        env:
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          RELEASE_SIGNING: ${{ vars.SIGNPATH_RELEASE_SIGNING }}
        run: |
          $configured = $env:HAS_TOKEN -eq 'true' -and [bool]$env:ORGANIZATION_ID
          if ("${{ github.ref_type }}" -eq "tag") {
            $policy = "release-signing"
            $enabled = $configured -and $env:RELEASE_SIGNING -eq 'true'
          } else {
            $policy = "test-signing"
            $enabled = $configured
          }
          if ($enabled) {
            Write-Host "Signing with SignPath policy $policy"
          } else {
            Write-Host "::warning::Packages are not signed: SignPath is not set up for $policy."
          }
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "policy=$policy" >> $env:GITHUB_OUTPUT

      - name: Build payload
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\tools\scripts\package_beta.ps1 -Stage Payload

      - name: Upload unsigned binaries
        id: unsigned-binaries
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-binaries
          path: |
            dist/Pulse/Pulse.exe
            dist/Pulse/service/PulseService.exe
          if-no-files-found: error

      - name: Sign binaries
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: PulseDiagnostics
          signing-policy-slug: ${{ steps.signing.outputs.policy }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          # Release signing waits for a maintainer to approve the request.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/binaries

      - name: Use signed binaries
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          foreach ($file in "Pulse.exe", "service/PulseService.exe") {
            $signed = Join-Path signed/binaries $file
            $signature = Get-AuthenticodeSignature $signed
            if (-not $signature.SignerCertificate) { throw "$file came back from SignPath without a signature" }
            Write-Host "$file signed by $($signature.SignerCertificate.Subject) ($($signature.Status))"
            Copy-Item $signed (Join-Path dist/Pulse $file) -Force
          }

      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\tools\scripts\package_beta.ps1 -Stage Installer

      - name: Upload unsigned installer
        id: unsigned-installer
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: dist/PulseDiagnostics-Setup-${{ steps.version.outputs.version }}-windows-x64.exe
          if-no-files-found: error

      - name: Sign installer
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: PulseDiagnostics
          signing-policy-slug: ${{ steps.signing.outputs.policy }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/installer

      - name: Use signed installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $file = "PulseDiagnostics-Setup-${{ steps.version.outputs.version }}-windows-x64.exe"
          $signed = Join-Path signed/installer $file
          $signature = Get-AuthenticodeSignature $signed
          if (-not $signature.SignerCertificate) { throw "$file came back from SignPath without a signature" }
          Write-Host "$file signed by $($signature.SignerCertificate.Subject) ($($signature.Status))"
          Copy-Item $signed (Join-Path dist $file) -Force

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object {
            $_.Name -like "PulseDiagnostics-Setup-${{ steps.version.outputs.version }}-*.exe" -or
            $_.Name -like "PulseDiagnostics-${{ steps.version.outputs.version }}-windows-x64.zip"
          }
          if ($files.Count -ne 2) { throw "Expected Setup.exe and zip, found $($files.Count)" }
          $files | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: pulse-${{ steps.version.outputs.version }}-windows
          path: |
            dist/PulseDiagnostics-Setup-${{ steps.version.outputs.version }}-windows-x64.exe
            dist/PulseDiagnostics-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $notes = "docs/releases/v$v.md"
          $assets = @(
            "dist/PulseDiagnostics-Setup-$v-windows-x64.exe",
            "dist/PulseDiagnostics-$v-windows-x64.zip",
            "dist/SHA256SUMS.txt"
          )
          if (Test-Path $notes) {
            gh release create "v$v" @assets --draft --title "Pulse Diagnostics v$v" --notes-file $notes
          } else {
            gh release create "v$v" @assets --draft --title "Pulse Diagnostics v$v" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
